<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Work order</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<style>
/* GT Hub: a shared work order, view only. Opened from a link the owner created in the app.
   It reads one work order through the GT Hub server (shareView / sharePhoto) and can't change anything. */
:root{--bg:#f3f1ec;--card:#fff;--ink:#1f2328;--muted:#6b6762;--line:#e3dfd7;--soft:#f5f4f1;--accent:#e5970f;--band:#1c1c1c;--flag:#fbe9da;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#ece9e4;--muted:#a49f97;--line:#33312e;--soft:#262523;--flag:#3d2a17}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
.band{background:var(--band);color:#fff;border-bottom:3px solid var(--accent)}
.band .in{max-width:860px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.band img{width:36px;height:36px;border-radius:8px}
.band b{display:block;font-size:17px}.band small{color:#f0a21c;font-size:12.5px}
.band .ro{margin-left:auto;font-size:12px;color:#c9c5bd;border:1px solid #444;border-radius:999px;padding:3px 10px;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h1{font-size:26px;line-height:1.2;margin:0}
.sub{color:var(--muted);margin-top:4px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pill{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 11px;white-space:nowrap;background:#e8eef8;color:#1a4f9c}
.pill.done{background:#dff3e6;color:#17582f}.pill.hold{background:#fff0d6;color:#7a4b00}.pill.wait{background:#eee;color:#555}
.meta{font-size:12.5px;color:var(--muted);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px;border-radius:10px;overflow:hidden;margin-top:14px}
.grid div{background:var(--soft);padding:9px 12px}.grid .full{grid-column:1/-1}
.k{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.v{white-space:pre-wrap}
h2{font-size:17px;margin:6px 0 2px;padding-left:10px;border-left:3px solid var(--accent)}
.subhd{background:var(--soft);border-left:3px solid var(--accent);border-radius:6px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.subhd b{font-size:16px}.subhd small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.lab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 3px}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13.5px}
.sumi{padding:10px 0;border-top:1px solid var(--line)}.sumi:first-of-type{border-top:0}.sumi .lab{margin-top:6px}
.upd{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.upd:first-of-type{border-top:0;margin-top:0}
.upd .d{font-weight:700}.upd .r{color:var(--muted);font-size:12.5px;margin-left:8px}
.upd .txt{margin:4px 0 0 2px}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
@media (min-width:700px){.figs{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.fig{margin:0;cursor:zoom-in}
.fig .ph{aspect-ratio:4/3;background:var(--soft);border-radius:8px;overflow:hidden;display:grid;place-items:center}
.fig img{width:100%;height:100%;object-fit:contain;display:block}
.fig figcaption{font-size:11.5px;color:var(--muted);margin-top:3px}
.fig .ph img{object-fit:cover}
.figs .fig.xh{display:none}
.more{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.more .chev{transition:transform .15s}.more[aria-expanded="true"] .chev{transform:rotate(180deg)}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .in{max-width:860px;margin:0 auto;padding:0 16px;display:flex;gap:4px}
.tabs button{font:inherit;font-size:15px;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:11px 12px 9px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font-weight:500;color:var(--muted);margin-left:4px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
@media (min-width:700px){.pgrid{grid-template-columns:repeat(5,1fr);gap:4px}}
.pgrid button{aspect-ratio:1;padding:0;border:0;background:var(--soft);cursor:zoom-in;overflow:hidden;display:block}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
#gal{padding:12px 0 40px}
@media (min-width:700px){#gal{padding:16px 16px 60px}}
.lbx .cap{line-height:1.45}.lbx .cap b{color:#fff}.lbx .cap small{display:block;color:#aaa;font-size:12.5px}
.gal .gh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:14px 0 2px}
.gal .gh:first-child{margin-top:0}.gal .gh b{font-size:15px}.gal .gh small{color:var(--muted);font-size:12.5px}
.gal .gt{font-size:13.5px;color:var(--muted);white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gal .go{font:inherit;font-size:12.5px;background:none;border:0;color:#1a5fb4;text-decoration:underline;cursor:pointer;padding:0}
.lbx .nav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:64px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:30px;padding:0;right:auto}
.lbx .nav.p{left:10px}.lbx .nav.n{right:10px;left:auto}
.lbx .nav[hidden]{display:none}
h3{font-size:14.5px;margin:14px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}.fig figcaption b{color:var(--ink);margin-right:6px}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:4px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}th{font-size:12px;color:var(--muted);background:var(--soft)}
td:first-child{font-weight:700}tr.flag td{background:var(--flag)}
.tw{overflow-x:auto}
.chk{list-style:none;margin:4px 0 0;padding:0}.chk li{padding:2px 0 2px 24px;position:relative}
.chk li::before{content:"☐";position:absolute;left:0;color:var(--muted)}.chk li.done::before{content:"☑";color:var(--ink)}.chk li.na::before{content:"N/A";font-size:9px;font-weight:700;top:6px}
.chk li.lv1{margin-left:18px}.chk .sec{padding-left:0;font-weight:700;color:var(--muted);font-size:13px;margin-top:6px}.chk .sec::before{content:""}
.chk .note{padding:6px 10px;background:var(--flag);border-left:3px solid var(--accent);font-weight:600;margin:6px 0}.chk .note::before{content:""}
.parts{margin:4px 0 0;padding-left:20px}a{color:#1a5fb4}
.msg{text-align:center;color:var(--muted);padding:60px 16px}.msg b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.lbx{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}
.lbx img{max-width:100%;max-height:100%;object-fit:contain}
.lbx button{position:fixed;top:12px;right:12px;font:inherit;font-size:15px;background:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.lbx .cap{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#ddd;font-size:14px}
footer{max-width:860px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px;text-align:center}
@media print{.band .ro,.lbx{display:none}body{background:#fff}.card{border:0;padding:0}}
</style>
</head>
<body>
<div class="band"><div class="in"><img src="icons/icon-192.png" alt=""><div><b id="org">GT Hub</b><small>Mould maintenance · work order</small></div><span class="ro">View only</span></div></div>
<nav class="tabs" id="tabs" hidden><div class="in" role="tablist"><button type="button" role="tab" data-tab="wo" aria-selected="true">Work order</button><button type="button" role="tab" data-tab="ph" aria-selected="false">Photos<span class="n" id="phn"></span></button></div></nav>
<main id="main"><div class="msg">Loading…</div></main>
<main id="gal" class="gal" hidden></main>
<footer id="foot"></footer>
<script>
(function(){
const FN="https://australia-southeast1-mould-log.cloudfunctions.net/";
const t=(location.hash||"").replace(/^#/,"").trim();
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const photo=(id,big)=>FN+"sharePhoto?t="+encodeURIComponent(t)+"&id="+encodeURIComponent(id)+(big?"&s=l":"");
const pillCls=s=>/complete|done|closed/i.test(s)?"done":/hold|wait|parts/i.test(s)?"hold":/pending|not started/i.test(s)?"wait":"";
const pill=s=>s?`<span class="pill ${pillCls(s)}">${esc(s)}</span>`:"";
const figRef=f=>{const ns=(f||[]).map(x=>x.fig);if(!ns.length)return "";const p=[];for(let i=0;i<ns.length;){let j=i;while(j+1<ns.length&&ns[j+1]===ns[j]+1)j++;p.push(j>i?ns[i]+"–"+ns[j]:String(ns[i]));i=j+1}return (ns.length>1?"Figs. ":"Fig. ")+p.join(", ")};
const figs=list=>list&&list.length?`<div class="figs">${list.map(f=>`<figure class="fig" data-id="${esc(f.id)}" data-cap="Fig. ${f.fig}${f.date?" · "+esc(f.date):""}"><div class="ph"><img src="${photo(f.id)}" alt="Fig. ${f.fig}" loading="lazy"></div><figcaption><b>Fig. ${f.fig}</b>${esc(f.date||"")}</figcaption></figure>`).join("")}</div>`:"";
function block(b){
  switch(b.t){
    case "grid":return `<div class="grid">${b.items.map(i=>`<div class="${i.full?"full":""}"><span class="k">${esc(i.k)}</span><span class="v">${esc(i.v)}</span></div>`).join("")}</div>`;
    case "h":return `<h2>${esc(b.text)}</h2>`;
    case "sub":return `<div class="subhd"><div><b>${esc((b.no?b.no+"  ":"")+b.name)}</b>${b.meta?`<small>${esc(b.meta)}</small>`:""}</div>${pill(b.status)}</div>`;
    case "field":return (b.label?`<div class="lab">${esc(b.label)}</div>`:"")+(b.tags?`<div class="tags">${String(b.text||"").split(/,\s*/).filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:`<div class="txt">${esc(b.text)}</div>`);
    case "upd":{const r=figRef(b.figs),more=b.figs?b.more:b.n;
      return (b.h3?`<h3>Updates</h3>`:b.label?`<div class="lab">${esc(b.label)}</div>`:"")+`<div class="upd" data-u="${b.__i}"><span class="d">${esc(b.date)}</span>${r||more?`<span class="r">${esc([r,more?more+" more photo"+(more===1?"":"s")+" not shown":""].filter(Boolean).join(" · "))}</span>`:""}${b.text?`<div class="txt">${esc(b.text)}</div>`:""}${figs(b.figs)}</div>`}
    case "table":return (b.label?`<div class="lab">${esc(b.label)}</div>`:"")+`<div class="tw"><table><thead><tr>${b.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${b.rows.map((r,i)=>`<tr class="${(b.flagged||[]).includes(i)?"flag":""}">${r.map(v=>`<td>${esc(Array.isArray(v)?v.map(x=>typeof x==="object"?x.t:x).join("\n"):v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "note":return `<div class="txt" style="color:var(--muted);font-style:italic">${esc(b.text)}</div>`;
    case "parts":return `<div class="lab">${esc(b.label)}</div><ul class="parts">${b.items.map(p=>`<li>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.text||p.url)}</a>`:esc(p.text)}</li>`).join("")}</ul>`;
    case "check":return `<div class="lab">${esc(b.label)}</div><div><b>${esc(b.summary)}</b></div><ul class="chk">${b.rows.map(r=>r.note?`<li class="note">Note: ${esc(r.note)}</li>`:r.sec?`<li class="sec">${esc(r.sec)}</li>`:r.group?`<li class="sec" style="font-weight:400;color:var(--ink)">${esc(r.t)}</li>`:`<li class="${r.st==="done"?"done":r.st==="na"?"na":""} ${r.lvl?"lv1":""}">${esc(r.t)}</li>`).join("")}</ul>`;
    default:return ""}}
function render(d){const s=d.snap;if(!s){$("#main").innerHTML=`<div class="msg"><b>Nothing to show yet</b>This work order hasn't been prepared for viewing.</div>`;return}
  document.title=s.title+" · "+s.subtitle;$("#org").textContent=s.org||"GT Hub";
  const bl=s.blocks||[],grid=bl.find(b=>b.t==="grid"),rest=bl.filter(b=>b!==grid);bl.forEach((b,i)=>b.__i=i);
  // sections: everything up to each heading goes in one card
  const cards=[];let cur=[];for(const b of rest){if(b.t==="h"&&cur.length){cards.push(cur);cur=[]}cur.push(b)}if(cur.length)cards.push(cur);
  // updates get their own section after the one they were in (with readings taken alongside them);
  // on a work order with several sub-jobs they stay with their sub-job, under their own heading
  const multi=rest.some(b=>b.t==="sub");
  if(!multi)for(let i=0;i<cards.length;i++){const c=cards[i],u=[];
    for(let k=0;k<c.length;k++){if(c[k].t==="upd"){u.push(c[k]);while(c[k+1]&&c[k+1].t==="table"&&!c[k+1].insp){u.push(c[k+1]);k++}}}
    if(u.length){cards[i]=c.filter(b=>!u.includes(b));cards.splice(i+1,0,[{t:"h",text:"Updates"},...u.map(b=>b.t==="upd"?{...b,label:""}:b)]);i++}}
  else rest.forEach(b=>{if(b.t==="upd"&&b.label)b.h3=true});
  let h=`<div class="card"><div class="toprow"><div><h1>${esc(s.title)}</h1><div class="sub">${esc(s.subtitle)}</div></div>${pill(s.status)}</div>${grid?block(grid):""}</div>`;
  if(s.summary)h+=`<div class="card"><h2>Summary</h2>${s.summary.map(x=>`<div class="sumi"><div class="toprow"><b>${esc((x.no?x.no+"  ":"")+x.name)}</b>${pill(x.status)}</div>${[["Description",x.desc],["Inspection / faults found",x.insp],["Work done",x.work]].filter(y=>y[1]).map(y=>`<div class="lab">${y[0]}</div><div class="txt">${esc(y[1])}</div>`).join("")}</div>`).join("")}</div>`;
  h+=cards.map(c=>`<div class="card">${c.map(block).join("")}</div>`).join("");
  if((s.groups||[]).length)h+=`<div class="card"><h2>Photos</h2>${s.groups.map(g=>(g.title?`<div class="lab">${esc(g.title)}</div>`:"")+figs(g.imgs)).join("")}</div>`;
  $("#main").innerHTML=h;
  // Photos tab: every shared photo in figure order, by the update it belongs to (then the rest)
  const sets=[];bl.forEach((b,i)=>{if(b.t==="upd"&&(b.figs||[]).length){let who="";for(let j=i;j>=0;j--)if(bl[j].t==="sub"){who=(bl[j].no?bl[j].no+"  ":"")+bl[j].name;break}sets.push({title:b.date,sub:who,text:b.text,imgs:b.figs,u:i})}});
  (s.groups||[]).forEach(g=>{if(g.imgs.length)sets.push({title:"Other photos",sub:g.title,imgs:g.imgs})});
  ALL=sets.flatMap(x=>x.imgs);
  if(ALL.length){$("#tabs").hidden=false;$("#phn").textContent=ALL.length;
    // where each photo came from, for the full-size view
    sets.forEach(x=>x.imgs.forEach(f=>{FROM[f.id]=x.u!=null?{upd:x.title,sub:x.sub,u:x.u}:{sub:x.sub}}));
    $("#gal").innerHTML=`<div class="pgrid">${ALL.map(f=>`<button type="button" class="fig" data-id="${esc(f.id)}" aria-label="Fig. ${f.fig}"><img src="${photo(f.id)}" alt="" loading="lazy"></button>`).join("")}</div>`}
  clamp();
  const upd=d.updatedAt?new Date(d.updatedAt):null,exp=d.expires?new Date(d.expires):null,f=x=>x.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
  $("#foot").textContent=["Shared from GT Hub. View only.",upd?"Last updated "+f(upd)+" "+upd.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})+".":"",exp?"This link works until "+f(exp)+".":""].filter(Boolean).join(" ")}
const open=new Set();
function clamp(){document.querySelectorAll("#main .figs").forEach((el,i)=>{el.dataset.k=el.dataset.k||String(i);const k=el.dataset.k;
  const tiles=[...el.children];tiles.forEach(x=>x.classList.remove("xh"));
  const top=tiles.length?tiles[0].offsetTop:0,extra=tiles.filter(x=>x.offsetTop>top+4);
  let btn=el.nextElementSibling;if(!(btn&&btn.classList.contains("more")))btn=null;
  if(!extra.length){if(btn)btn.remove();return}
  const isOpen=open.has(k);if(!isOpen)extra.forEach(x=>x.classList.add("xh"));
  if(!btn){btn=document.createElement("button");btn.type="button";btn.className="more";el.after(btn)}
  btn.dataset.k=k;btn.setAttribute("aria-expanded",String(isOpen));
  btn.innerHTML=(isOpen?"Show fewer":`+${extra.length} more photo${extra.length===1?"":"s"}`)+' <span class="chev" aria-hidden="true">▾</span>'})}
let rt=0;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(clamp,120)});
document.addEventListener("click",e=>{const m=e.target.closest(".more");if(m){const k=m.dataset.k;open.has(k)?open.delete(k):open.add(k);clamp();if(!open.has(k))m.previousElementSibling.scrollIntoView({block:"nearest"});return}});
// full-size viewer: steps through the photos (arrows, keys or a swipe)
let ALL=[],LBI=-1,FROM={};
function lbShow(i){LBI=i;const f=ALL[i];if(!f)return;let o=$(".lbx");
  if(!o){o=document.createElement("div");o.className="lbx";o.innerHTML=`<img alt=""><button type="button" class="x">Close</button><button type="button" class="nav p" aria-label="Previous photo">‹</button><button type="button" class="nav n" aria-label="Next photo">›</button><div class="cap"></div>`;document.body.appendChild(o);
    o.addEventListener("click",e=>{if(e.target.closest(".p"))lbShow(LBI-1);else if(e.target.closest(".n"))lbShow(LBI+1);else if(e.target.closest(".go"))return;else lbClose()});
    let sx=null;o.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});o.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50){lbShow(LBI+(dx<0?1:-1))}})}
  o.querySelector("img").src=photo(f.id,true);const fr=FROM[f.id]||{};
  o.querySelector(".cap").innerHTML=`<b>Fig. ${f.fig}</b>${f.date?" · taken "+esc(f.date):""} · ${i+1} of ${ALL.length}<small>${fr.upd?"From the update on "+esc(fr.upd):"Other photos"}${fr.sub?" · "+esc(fr.sub):""}${fr.u!=null?` · <button type="button" class="go" data-u="${fr.u}" style="color:#9cc3ff">Read update</button>`:""}</small>`;
  o.querySelector(".p").hidden=i<=0;o.querySelector(".n").hidden=i>=ALL.length-1;
  [ALL[i+1],ALL[i-1]].forEach(n=>{if(n)new Image().src=photo(n.id,true)})}
function lbClose(){const o=$(".lbx");if(o)o.remove();LBI=-1}
document.addEventListener("click",e=>{const fg=e.target.closest(".fig");if(fg){const i=ALL.findIndex(x=>x.id===fg.dataset.id);if(i>=0)lbShow(i);return}
  const tb=e.target.closest("[data-tab]");if(tb){const ph=tb.dataset.tab==="ph";document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b===tb)));$("#main").hidden=ph;$("#gal").hidden=!ph;scrollTo(0,0);if(!ph)clamp();return}
  const go=e.target.closest(".go");if(go){lbClose();const el=[...document.querySelectorAll("#main .upd")].find(x=>x.dataset.u===go.dataset.u);
    document.querySelector('[data-tab="wo"]').click();if(el){el.scrollIntoView({block:"start"});scrollBy(0,-56)}}});
document.addEventListener("keydown",e=>{if(LBI<0)return;if(e.key==="Escape")lbClose();else if(e.key==="ArrowRight")lbShow(LBI+1);else if(e.key==="ArrowLeft")lbShow(LBI-1)});
if(!/^[A-Za-z0-9_-]{24,64}$/.test(t)){$("#main").innerHTML=`<div class="msg"><b>This link isn't complete</b>Check that the whole link was copied.</div>`;return}
fetch(FN+"shareView",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({t})})
  .then(r=>r.json().then(j=>({ok:r.ok,j})))
  .then(({ok,j})=>{if(!ok){$("#main").innerHTML=`<div class="msg"><b>Not available</b>${esc(j.error||"This link doesn't work.")}</div>`;return}render(j)})
  .catch(()=>{$("#main").innerHTML=`<div class="msg"><b>Couldn't load</b>Check your connection and try again.</div>`});
})();
</script>
</body>
</html>
